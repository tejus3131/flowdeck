<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flowdeck design playground</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body>
    <header class="pg-bar">
      <strong>Flowdeck playground</strong>
      <span class="pg-hint">every axis below re-renders all pages live</span>
      <div class="pg-controls">
        <label>page
          <select id="page">
            <option value="board">Board</option>
            <option value="drawer">Card drawer</option>
            <option value="dashboard">Dashboard</option>
            <option value="chat">Board chat</option>
            <option value="profile">Profile</option>
          </select>
        </label>
        <label>philosophy
          <select id="philosophy">
            <option value="p1">P1 — Calm (Notion-warm, flat, quiet)</option>
            <option value="p2">P2 — Crisp (Linear-cool, elevated, fast)</option>
            <option value="p3">P3 — Playful (springs, color-forward, Canva-ish)</option>
            <option value="p4">P4 — Dense (compact 13px, pro-tool)</option>
          </select>
        </label>
        <label>gray
          <select id="gray">
            <option value="warm">warm</option>
            <option value="cool">cool</option>
          </select>
        </label>
        <label>accent
          <select id="accent">
            <option value="indigo">indigo</option>
            <option value="violet">violet</option>
          </select>
        </label>
        <label>theme
          <select id="theme">
            <option value="light">light</option>
            <option value="dark">dark</option>
          </select>
        </label>
        <label>motion
          <select id="motion">
            <option value="on">on</option>
            <option value="reduced">reduced</option>
          </select>
        </label>
      </div>
    </header>
    <main id="stage"></main>
    <script src="./data.js"></script>
    <script src="./pages.js"></script>
    <script src="./playground.js"></script>
  </body>
</html>
