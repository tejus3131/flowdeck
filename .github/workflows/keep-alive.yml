# Keep-alive — free-tier Supabase projects pause after 1 week of
# inactivity (ADR-12). A weekly REST ping keeps both projects awake.
# Uses only public values (publishable key is public by design; RLS is
# the gate). Runs on the default branch only.
#
# Repo-level variables (public values, safe outside environments):
#   PREVIEW_SUPABASE_URL, PREVIEW_SUPABASE_PUBLISHABLE_KEY
# The prod pair already exists as VITE_* in the production environment,
# but scheduled workflows don't run in an environment context — so the
# prod values are mirrored here as repo-level variables too.
name: keep-alive

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC — off the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: preview
            url: ${{ vars.PREVIEW_SUPABASE_URL }}
            key: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          - project: production
            url: ${{ vars.PROD_SUPABASE_URL }}
            key: ${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Ping ${{ matrix.project }} project REST API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ matrix.key }}" \
            "${{ matrix.url }}/rest/v1/" || true)
          echo "${{ matrix.project }} ping: HTTP $code"
          # 401/404 still proves the project is awake — only a pause
          # (connection failure) is a problem.
          if [ "$code" = "000" ]; then
            echo "::warning::${{ matrix.project }} project unreachable — may be paused"
          fi
