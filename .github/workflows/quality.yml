# Quality gate — runs on every PR to preview/main. Zero provider
# credentials reach this workflow (ADR-15): the Supabase stack runs LOCALLY
# on the runner, so PR code cannot exfiltrate deploy tokens.
name: quality

on:
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        # version comes from packageManager in package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (client env from repo-level public vars — a PR run has
          no environment context, so environment-scoped VITE_* would be
          empty here; the preview project's public values give the gate a
          representative build)
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}

      # The local Supabase stack: migrations apply fresh, db-guards
      # self-seeds its fixture (see src/server/db-guards.test.ts).
      - name: Start local Supabase stack
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: latest

      - name: Run migrations on local stack
        run: supabase db reset

      - name: Test (client + server projects)
        run: pnpm test -- --run
        env:
          # The server project's env stub reads process.env at call time.
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: test-anon-key-placeholder-value
          SUPABASE_SECRET_KEY: test-service-key-placeholder-value
