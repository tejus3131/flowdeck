# Deploy production — merge into `main` (via the preview→main release
# PR, approved by the `production` environment's required reviewer)
# brings production to the state of the branch. Legs are diffed against
# the last SUCCESSFUL deploy of the environment (the latest `release-r*`
# tag — never `preview-r*`), not "what this merge changed" (ADR-14
# order: migrations → edge functions → worker). Every leg is idempotent,
# so over-deploy is safe and under-deploy is the only failure mode —
# that bias is what makes a failed deploy self-heal on the next merge.
# `workflow_dispatch` (with an optional `force`) is the unconditional
# escape hatch. Credentials are environment-scoped (ADR-15): PR runs
# can never read them.
name: deploy-prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy every leg regardless of the diff'
        type: boolean
        default: false

permissions:
  contents: write # the release step tags + creates the GitHub Release (contents API)
  deployments: write # ...and records a Deployment per deploy

concurrency:
  group: deploy-prod
  cancel-in-progress: false # queue deploys; never cancel a mid-deploy

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      migrations: ${{ steps.legs.outputs.migrations }}
      functions: ${{ steps.legs.outputs.functions }}
      worker: ${{ steps.legs.outputs.worker }}
    steps:
      # fetch-depth: 0 (full clone) fetches ALL tags plus full history —
      # both requirements of the base resolution below. A shallow clone
      # breaks when the base commit isn't local (the first preview merge
      # failed exactly here), a 1-2 commit clone under-reports on
      # multi-commit pushes. The repo is small — a full clone costs ~2s;
      # a silently skipped deploy costs an incident.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # The diff base is the last SUCCESSFUL deploy of this environment —
      # the latest `release-r*` tag (never `preview-r*`), created only
      # after every leg passed — not the push event's `before` sha. A
      # deploy means "make the environment match the branch", so a failed
      # deploy must be picked up by the NEXT merge diffing against the
      # last success: that is the self-healing property. The push
      # `before` sha can never supply it — that fallback IS the
      # state-blindness bug this replaces.
      #
      # Ancestor guard: if the tag's commit is not an ancestor of HEAD
      # (force-push, re-pointed tag), history is untrustworthy and a diff
      # across it would silently under-report. Fail safe toward
      # over-deploy: BASE="" → all legs true (every leg is idempotent —
      # `db push` applies only missing migrations; functions/worker
      # upload current code).
      #
      # Sparse tags: skipped runs still consume run numbers (release-r10
      # may not exist); `sort -V | tail -1` handles gaps.
      - name: Resolve deploy base — last successful deploy tag
        id: base
        run: |
          LAST_TAG=$(git tag -l 'release-r*' | sort -V | tail -1)
          BASE=""
          if [ -n "$LAST_TAG" ]; then
            BASE=$(git rev-parse "$LAST_TAG^{commit}" 2>/dev/null || true)
            if [ -n "$BASE" ] && ! git merge-base --is-ancestor "$BASE" HEAD; then
              BASE="" # untrustworthy history → full deploy
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if [ -n "$BASE" ]; then
            N=$(git rev-list --count "$BASE..HEAD")
            echo "diffed \`$LAST_TAG\` → HEAD, $N commits since last successful deploy" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BASE empty → full deploy (all legs)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Skipped when BASE is empty: a paths-filter run with no base would
      # fall back to the push `before` sha — exactly the bug. The legs
      # step below covers the empty-base case.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.base.outputs.base != ''
        with:
          base: ${{ steps.base.outputs.base }}
          filters: |
            migrations:
              - 'supabase/migrations/**'
              - 'supabase/config.toml'
            functions:
              - 'supabase/functions/**'
            worker:
              - 'src/**'
              - 'public/**'
              - 'env.ts'
              - 'vite.config.ts'
              - 'wrangler.jsonc'
              - 'package.json'
              - 'pnpm-lock.yaml'

      # Single source of the leg outputs. BASE empty (first run or guard
      # tripped) → all legs true; a `force` dispatch does the same.
      #
      # Concurrency: with cancel-in-progress: false a queued run doesn't
      # check out until the in-flight run finished and tagged, so it
      # always diffs against the fresh tag. Even if it didn't, the
      # superset it would deploy is idempotent — safe either way.
      - name: Legs to deploy
        id: legs
        run: |
          FORCE="${{ inputs.force }}"
          if [ -z "${{ steps.base.outputs.base }}" ] || [ "$FORCE" = "true" ]; then
            MIG=true; FUN=true; WRK=true
          else
            MIG="${{ steps.filter.outputs.migrations }}"
            FUN="${{ steps.filter.outputs.functions }}"
            WRK="${{ steps.filter.outputs.worker }}"
          fi
          echo "migrations=$MIG" >> "$GITHUB_OUTPUT"
          echo "functions=$FUN" >> "$GITHUB_OUTPUT"
          echo "worker=$WRK" >> "$GITHUB_OUTPUT"
          LEGS=""
          [ "$MIG" = "true" ] && LEGS="${LEGS}migrations+"
          [ "$FUN" = "true" ] && LEGS="${LEGS}functions+"
          [ "$WRK" = "true" ] && LEGS="${LEGS}worker+"
          echo "legs: ${LEGS%+} (empty → deploy job skips, no tag)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: changes
    # Load-bearing gate: a no-op run (docs-only merge, zero-leg diff)
    # must NOT deploy and must NOT tag — a tag from an empty run would
    # poison the next run's BASE and strand the diff it skipped.
    if: needs.changes.outputs.migrations == 'true' || needs.changes.outputs.functions == 'true' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The supabase CLI is NOT preinstalled on ubuntu-latest (see
      # deploy-preview.yml). Pinned to match local dev.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.4.0

      # 1. Schema first (ADR-14). IPv4 note: see deploy-preview.yml —
      #    migrations go through the session pooler (GitHub runners are
      #    IPv4-only; db.<ref> is IPv6-only). CLI 3.x: --remote=<url>
      #    replaces the deprecated --db-url; --yes answers the apply
      #    prompt (no terminal in CI).
      - name: Push migrations
        if: needs.changes.outputs.migrations == 'true'
        run: supabase db push --remote="postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_POOLER_HOST }}:5432/postgres" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # 2. Edge functions (MCP).
      - name: Deploy MCP edge function
        if: needs.changes.outputs.functions == 'true'
        run: supabase functions deploy mcp --no-verify-jwt --remote=${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # 3. Worker — build with the prod project's public client env.
      - name: Build
        if: needs.changes.outputs.worker == 'true'
        run: pnpm build
        env:
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}

      - name: Deploy worker (production)
        if: needs.changes.outputs.worker == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Every deploy is a release (release-rN): auto-generated notes list
      # the PRs merged since the previous PRODUCTION release — the
      # changelog IS the release history. The Deployment record lands on
      # the `production` environment, after its required reviewer.
      - name: Release — tag, notes, deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="release-r${{ github.run_number }}"
          legs=""
          [ "${{ needs.changes.outputs.migrations }}" = "true" ] && legs="${legs}migrations "
          [ "${{ needs.changes.outputs.functions }}" = "true" ] && legs="${legs}mcp-functions "
          [ "${{ needs.changes.outputs.worker }}" = "true" ] && legs="${legs}worker "
          body=$(printf 'Deployed to **production** from `%s`.\n\nLegs deployed: %s\nCommit: %s' \
            "${GITHUB_SHA:0:7}" "${legs:-none}" "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}")
          PREV=$(gh release list --limit 50 --json tagName \
            --jq '[.[].tagName | select(startswith("release-"))][0] // ""')
          # Re-run safe: a re-run of a partially-failed run re-executes
          # this step with the same run_number — the tag may already
          # exist (release view instead of create) and the sha may
          # already carry a Deployment (reuse it, re-post the status).
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists (re-run) — updating notes"
            gh release edit "$TAG" --notes "$body" > /dev/null
          elif [ -n "$PREV" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Release — $TAG" \
              --notes "$body" --generate-notes --notes-start-tag "$PREV"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Release — $TAG" \
              --notes "$body" --generate-notes
          fi
          # Reuse the deployment the environment gate created when this job
          # started (its `ref` is the BRANCH name — "main"/"preview" — not
          # the SHA, so a ref-filtered lookup misses it and mints a second
          # record). Match on the SHA client-side instead: one deployment
          # record per deploy, the gate's, marked success only here —
          # after every leg passed.
          DEPLOY_ID=$(gh api "repos/$GH_REPO/deployments?environment=production&per_page=20" \
            --jq "[.[] | select(.sha == \"$GITHUB_SHA\")][0].id // \"\"")
          if [ -z "$DEPLOY_ID" ]; then
            # required_contexts=[] skips GitHub's commit-status validation:
            # when omitted, the API verifies required contexts and fails with
            # 409 'Commit status checks failed' on refs that carry none.
            DEPLOY_ID=$(printf '{"ref":"%s","environment":"production","auto_merge":false,"required_contexts":[]}' "$GITHUB_SHA" \
              | gh api "repos/$GH_REPO/deployments" --input - --jq '.id')
          fi
          gh api -X POST "repos/$GH_REPO/deployments/$DEPLOY_ID/statuses" \
            -f state="success" -f environment="production"
