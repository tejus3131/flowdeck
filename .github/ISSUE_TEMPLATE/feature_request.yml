name: Feature request
description: Suggest a new capability or an improvement to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard or impossible today? Describe the user-visible problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Alternatives you considered are welcome.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Architecture fit
      description: |
        Orbit has a locked architecture (see docs/architecture.md) and decision
        records (docs/adr.md). If you know your idea touches one — e.g. it would
        need a new realtime channel or a denormalized copy — say so here. Ideas
        that contradict a locked decision will likely be declined unless the ADR
        should change.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or sketches.
