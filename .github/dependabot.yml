# Dependabot: alerts + security updates are repo settings (no file needed);
# this file turns on scheduled version updates — bumping deps that are
# merely outdated, not vulnerable. Two ecosystems, both weekly, minor/patch
# grouped so a PR lands per bump-batch instead of per dependency.
version: 2
updates:
  - package-ecosystem: npm # covers pnpm lockfiles too
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
