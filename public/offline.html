<!doctype html>
<!-- A static file with no build step: the brand name and theme color
     here are literals, the same exception public/sw.js had (the pr-prep
     brand grep covers src/routes + src/components only). A rebrand
     updates this file by hand alongside brand.ts. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Offline — Flowdeck</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #ffffff;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #fafafa;
        }
      }
      main {
        max-width: 26rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.5;
        margin: 0 0 1.25rem;
        opacity: 0.7;
      }
      a {
        display: inline-block;
        font-size: 0.875rem;
        font-weight: 500;
        color: #4f46e5;
        text-decoration: none;
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This page needs the network. Boards you've already opened keep working — use your
        browser's back button to return to them; your edits will sync when you're back online.
      </p>
    </main>
  </body>
</html>
